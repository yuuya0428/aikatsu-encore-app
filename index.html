<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#e83b91"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>アイカツ！アンコール カード帳</title><style>*{box-sizing:border-box}body{margin:0;background:#fff6fb;color:#4b3346;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{position:sticky;top:0;background:#fffdfedb;backdrop-filter:blur(12px);padding:16px;border-bottom:1px solid #f0d7e8;z-index:5}h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#987a91}main{padding:14px;max-width:1100px;margin:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input,button{font:inherit;border:1px solid #f0d7e8;border-radius:999px;padding:9px 12px;background:white}.bar input{flex:1;min-width:180px}.on{background:#e83b91!important;color:white;border-color:#e83b91!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}.card{background:white;border:1px solid #f0d7e8;border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #8b527018}.card.have{border-color:#e83b9160;box-shadow:0 7px 24px #e83b9120}.visual{aspect-ratio:.72;background:radial-gradient(circle at 50% 20%,#fff,#fbe8f5 48%,#ead0e7);padding:8px;position:relative}.card img{width:100%;height:100%;object-fit:contain;display:block;border-radius:9px;transition:opacity .2s,filter .2s}.card:not(.have) img{opacity:.34;filter:grayscale(.35) saturate(.55)}.card.have img{opacity:1;filter:none}.badge{position:absolute;right:8px;top:8px;background:#d64c93;color:#fff;border-radius:8px;padding:3px 6px;font-size:9px;font-weight:900}.pbadge{background:#6d64c7}.body{padding:9px}.no{font-weight:800;font-size:12px;color:#987a91}.name{font-size:11px;font-weight:800;line-height:1.35;margin:3px 0 8px;word-break:break-all}.counter{display:flex;align-items:center;justify-content:space-between;border:1px solid #f2d9e9;border-radius:999px;padding:4px;background:#fff7fb}.counter button{width:40px;height:40px;padding:0;border:0;border-radius:50%;background:#fff;color:#e83b91;font-weight:900;font-size:25px}.counter b{font-size:16px;min-width:46px;text-align:center}.want{margin-top:7px;width:100%;padding:7px;border-radius:999px}.want.on{background:#e9f7f4;color:#3c9b8b}.note{font-size:11px;color:#987a91;margin:10px 0 18px}.empty{text-align:center;padding:35px;color:#987a91}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}main{padding:10px}}</style></head><body><div id="gate" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#fff6fb,#f7e7f3);display:flex;align-items:center;justify-content:center;padding:20px"><div style="width:min(420px,100%);background:#fff;border:1px solid #f0d7e8;border-radius:24px;padding:26px;box-shadow:0 15px 50px #8b527018;text-align:center"><div style="font-size:30px">✦</div><h2 style="margin:8px 0">アイカツ！アンコール カード帳</h2><p style="color:#987a91;font-size:13px">このページは合言葉でロックされています。<br>一度解除すると、この端末では次回から入力不要です。</p><input id="pass" type="password" autocomplete="current-password" placeholder="合言葉" style="width:100%;padding:13px 15px;border:1px solid #f0d7e8;border-radius:999px;font:inherit;outline:none"><button id="unlock" style="margin-top:10px;width:100%;padding:13px;border:0;border-radius:999px;background:#e83b91;color:#fff;font:inherit;font-weight:800">開く</button><div id="gateMsg" style="min-height:20px;margin-top:10px;color:#d64c93;font-size:12px"></div></div></div><header><h1>アイカツ！アンコール カード帳 ✦</h1><div class="sub">通常85＋プロモ28＋パラレル26｜所持・ほしいを保存</div></header><main><div class="bar"><input id="q" placeholder="カード番号・画像名で検索"><button class="on" id="normal">通常＋プロモ</button><button id="parallel">パラレルだけ</button><button id="all">すべて</button><button id="unowned">未所持だけ</button><button id="wantedOnly">ほしいだけ</button></div><div class="note" id="status">カード画像一覧を読み込み中…</div><div class="grid" id="grid"></div></main><script>(async()=>{const gate=document.getElementById("gate"),pass=document.getElementById("pass"),unlock=document.getElementById("unlock"),msg=document.getElementById("gateMsg"),ACCESS="aikatsuEncoreAccessGranted";async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}async function openApp(){gate.style.display="none"}if(localStorage.getItem(ACCESS)==="1"){openApp()}else{unlock.onclick=async()=>{if(await sha256(pass.value)==="499a22b6de7a0fa782a7108a3293700ca34a7d621392e2a524603a4b9a125f6a"){localStorage.setItem(ACCESS,"1");openApp()}else{msg.textContent="合言葉が違います。";pass.select()}};pass.addEventListener("keydown",e=>{if(e.key==="Enter")unlock.click()})}})();</script><script>const API="https://api.github.com/repos/min-poke/cardlist-aikatsu-encore/contents/images%2Fcards";const RAW="https://raw.githubusercontent.com/min-poke/cardlist-aikatsu-encore/main/images/cards/";const KEY="aikatsuEncoreChecklist_v2";const parallelIds=new Set(["E1-01","E1-02","E1-03","E1-04","E1-30","E1-31","E1-32","E1-33","E1-34","E1-35","E1-36","E1-50","E1-51","E1-52","E1-71","E1-72","E1-73","E1-74","E1-75","E1-76","E1-77","E1-78","E1-79","E1-80","E1-81","E1-82"]);let state={},files=[],mode="normal",onlyUnowned=false,onlyWanted=false;try{state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}function idOf(n){return(n.match(/^(E1-\d+|EP-\d+)/)||[])[1]||n}function qty(id){return state[id]?.have||0}function want(id){return!!state[id]?.want}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function change(id,d){state[id]={...(state[id]||{}),have:Math.max(0,qty(id)+d)};save()}function toggleWant(id){state[id]={...(state[id]||{}),want:!want(id)};save()}function render(){let q=document.getElementById("q").value.toLowerCase();let a=files.filter(f=>f.name.endsWith(".webp")&&!f.name.includes("_p1"));if(mode==="normal")a=a.filter(f=>!parallelIds.has(idOf(f.name)));if(mode==="parallel")a=a.filter(f=>parallelIds.has(idOf(f.name)));if(q)a=a.filter(f=>f.name.toLowerCase().includes(q));if(onlyUnowned)a=a.filter(f=>qty(idOf(f.name))===0);if(onlyWanted)a=a.filter(f=>want(idOf(f.name)));document.getElementById("grid").innerHTML=a.length?a.map(f=>{let id=idOf(f.name),n=qty(id),p=parallelIds.has(id);return '<article class="card '+(n?'have':'')+'"><div class="visual"><img loading="lazy" src="'+RAW+encodeURIComponent(f.name)+'"><span class="badge '+(p?'pbadge':'')+'">'+(p?'PARALLEL':'CARD')+'</span></div><div class="body"><div class="no">'+id+(p?' · P':'')+'</div><div class="name">'+f.name+'</div><div class="counter"><button data-id="'+id+'" onclick="change(this.dataset.id,-1)">−</button><b>'+n+'枚</b><button data-id="'+id+'" onclick="change(this.dataset.id,1)">＋</button></div><button class="want '+(want(id)?'on':'')+'" data-id="'+id+'" onclick="toggleWant(this.dataset.id)">♡ '+(want(id)?'ほしい':'ほしいに追加')+'</button></div></article>'}).join(""):"<div class="empty">条件に合うカードがありません</div>";let base=files.filter(f=>f.name.endsWith(".webp")&&!f.name.includes("_p1")).length;let have=Object.values(state).reduce((s,x)=>s+(x.have||0),0);let wanted=Object.values(state).filter(x=>x.want).length;document.getElementById("status").textContent=a.length+"枚表示・所持合計 "+have+"枚・ほしい "+wanted+"枚・対象 "+(base+parallelIds.size)+"枚"}function setMode(m){mode=m;["normal","parallel","all"].forEach(x=>document.getElementById(x).classList.remove("on"));document.getElementById(m).classList.add("on");render()}document.getElementById("q").oninput=render;document.getElementById("normal").onclick=()=>setMode("normal");document.getElementById("parallel").onclick=()=>setMode("parallel");document.getElementById("all").onclick=()=>setMode("all");document.getElementById("unowned").onclick=()=>{onlyUnowned=!onlyUnowned;document.getElementById("unowned").classList.toggle("on",onlyUnowned);render()};document.getElementById("wantedOnly").onclick=()=>{onlyWanted=!onlyWanted;document.getElementById("wantedOnly").classList.toggle("on",onlyWanted);render()};async function load(){try{let r=await fetch(API);files=await r.json();render()}catch(e){document.getElementById("status").textContent="画像一覧を取得できませんでした。"}}load();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>
