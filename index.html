<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e83b91"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>アイカツ！アンコール カード帳</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6fb;color:#4b3346;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{position:sticky;top:0;background:#fffdfebf;backdrop-filter:blur(12px);padding:16px;border-bottom:1px solid #f0d7e8;z-index:2}h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#987a91}main{padding:14px;max-width:1000px;margin:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,button{font:inherit;border:1px solid #f0d7e8;border-radius:999px;padding:9px 12px;background:white}input{flex:1;min-width:180px}.on{background:#e83b91;color:white;border-color:#e83b91}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.card{background:white;border:1px solid #f0d7e8;border-radius:16px;overflow:hidden}.card.have{border-color:#e83b91;box-shadow:0 5px 18px #e83b9120}.card img{width:100%;aspect-ratio:.72;object-fit:contain;background:#fff8fc;display:block}.body{padding:9px}.no{font-weight:800;font-size:12px}.name{font-size:11px;color:#987a91;margin:3px 0 8px;word-break:break-all}.counter{display:flex;align-items:center;justify-content:space-between;border:1px solid #f0d7e8;border-radius:12px;padding:3px}.counter button{border:0;padding:4px 10px;color:#e83b91;font-weight:900;background:#fff7fb}.counter b{font-size:12px}.note{font-size:11px;color:#987a91;margin:10px 0 18px}
</style></head><body><header><h1>アイカツ！アンコール カード帳 ✦</h1><div class="sub">カード所持数をこの端末に保存・GitHub Pages / PWA対応</div></header><main><div class="bar"><input id="q" placeholder="カード番号で検索"><button class="on" id="normal">通常画像</button><button id="parallel">パラレル候補</button><button id="all">すべて</button></div><div class="note" id="status">カード画像一覧を読み込み中…</div><div class="grid" id="grid"></div></main>
<script>
const API='https://api.github.com/repos/min-poke/cardlist-aikatsu-encore/contents/images%2Fcards';const RAW='https://raw.githubusercontent.com/min-poke/cardlist-aikatsu-encore/main/images/cards/';const key='aikatsuEncoreChecklist_v2';let state=JSON.parse(localStorage.getItem(key)||'{}'),files=[],mode='normal';
const parallelIds=new Set(['E1-01','E1-02','E1-03','E1-04','E1-30','E1-31','E1-32','E1-33','E1-34','E1-35','E1-36','E1-50','E1-51','E1-52','E1-71','E1-72','E1-73','E1-74','E1-75','E1-76','E1-77','E1-78','E1-79','E1-80','E1-81','E1-82']);
function save(){localStorage.setItem(key,JSON.stringify(state));render()}function qty(id){return state[id]?.have||0}function change(id,d){state[id]={...(state[id]||{}),have:Math.max(0,qty(id)+d)};save()}function idOf(n){return n.match(/^(E1-\d+|EP-\d+)/)?.[1]||n}
function render(){let q=document.getElementById('q').value.toLowerCase();let arr=files.filter(f=>f.name.endsWith('.webp')&&!f.name.includes('_p1'));if(mode==='parallel')arr=arr.filter(f=>parallelIds.has(idOf(f.name)));if(q)arr=arr.filter(f=>f.name.toLowerCase().includes(q));document.getElementById('grid').innerHTML=arr.map(f=>{let id=idOf(f.name),n=qty(id);return '<article class="card '+(n?'have':'')+'"><img loading="lazy" src="'+RAW+encodeURIComponent(f.name)+'"><div class="body"><div class="no">'+id+'</div><div class="name">'+f.name+'</div><div class="counter"><button onclick="change(\''+id+'\',-1)">−</button><b>'+n+'枚</b><button onclick="change(\''+id+'\',1)">＋</button></div></div></article>'}).join('');document.getElementById('status').textContent=arr.length+'枚表示・所持合計 '+Object.values(state).reduce((a,x)=>a+(x.have||0),0)+'枚'}
async function load(){try{let r=await fetch(API);files=await r.json();render()}catch(e){document.getElementById('status').textContent='画像一覧を取得できませんでした。'} }document.getElementById('q').oninput=render;function modeSet(m){mode=m;['normal','parallel','all'].forEach(x=>document.getElementById(x).classList.remove('on'));document.getElementById(m==='normal'?'normal':m==='parallel'?'parallel':'all').classList.add('on');render()}document.getElementById('normal').onclick=()=>modeSet('normal');document.getElementById('parallel').onclick=()=>modeSet('parallel');document.getElementById('all').onclick=()=>{mode='all';['normal','parallel','all'].forEach(x=>document.getElementById(x).classList.remove('on'));document.getElementById('all').classList.add('on');render()};load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
